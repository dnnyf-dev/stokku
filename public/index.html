<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StokKu — Stok Barang UMKM</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23D4A857'/%3E%3Cpath d='M8 12l8-4 8 4v9l-8 4-8-4zM8 12l8 4 8-4M16 16v9' fill='none' stroke='%2314110d' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LOGIN / DAFTAR -->
<main id="authView" class="auth" hidden>
  <div class="auth-card">
    <div class="brand"><i>▣</i><b>StokKu</b></div>
    <p class="muted">Catat stok barang tokomu dengan rapi. Tahu kapan harus belanja ulang sebelum barang habis.</p>
    <div class="seg" role="tablist">
      <button id="tabLogin" class="on" role="tab">Masuk</button>
      <button id="tabReg" role="tab">Daftar</button>
    </div>
    <form id="authForm" novalidate>
      <label id="nameRow" hidden>Nama<input id="aName" autocomplete="name" maxlength="60"></label>
      <label>Email<input id="aEmail" type="email" autocomplete="email" required></label>
      <label>Password<input id="aPass" type="password" autocomplete="current-password" required minlength="8"></label>
      <p class="err" id="authErr" role="alert"></p>
      <button class="btn primary block" id="authBtn" type="submit">Masuk</button>
    </form>
    <div class="or"><span>atau</span></div>
    <button class="btn ghost block" id="demoBtn">Coba akun demo (tanpa daftar)</button>
  </div>
</main>

<!-- APLIKASI -->
<div id="appView" hidden>
  <header class="top">
    <div class="brand"><i>▣</i><b>StokKu</b></div>
    <nav id="nav">
      <button data-page="dash" class="on">Ringkasan</button>
      <button data-page="products">Produk</button>
      <button data-page="history">Riwayat</button>
    </nav>
    <div class="who"><span id="whoName"></span><button class="btn ghost sm" id="logoutBtn">Keluar</button></div>
  </header>
  <div class="demo-bar" id="demoBar" hidden>Mode demo: data ini sementara dan hanya milik sesi kamu.</div>

  <main class="page" id="page"></main>
</div>

<!-- MODAL -->
<div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
